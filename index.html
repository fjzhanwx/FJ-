<!DOCTYPE html>
<html lang="zh-CN" data-theme="skyblue" data-fontsize="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>信息工作台</title>
<style>
/* ========== 重置与基础 ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Helvetica Neue",sans-serif;background:var(--main-bg);color:var(--text-primary);font-size:var(--fs-base);line-height:1.6;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit;outline:none}
ul,ol{list-style:none}
img{max-width:100%;display:block}

/* ========== 主题变量 ========== */
:root{
  --fs-small:13px; --fs-medium:15px; --fs-large:18px;
  --fs-base:var(--fs-medium);
  /* 天蓝 */
  --primary:#1E88E5; --primary-light:#64B5F6; --primary-dark:#1565C0;
  --primary-bg:#E3F2FD; --main-bg:#F0F6FF;
  --sidebar-bg:#ffffff; --card-bg:#ffffff;
  --text-primary:#1a2332; --text-secondary:#6b7c93; --text-muted:#9ea8b8;
  --border:#dce4ee; --shadow:0 2px 12px rgba(30,100,200,.08);
  --shadow-lg:0 8px 30px rgba(30,100,200,.12);
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --sidebar-w:248px;
  --danger:#e53935; --success:#00897B; --warning:#FB8C00;
}
[data-theme="deepblue"]{--primary:#1565C0;--primary-light:#42A5F5;--primary-dark:#0D47A1;--primary-bg:#E8EAF6;--main-bg:#F5F8FC}
[data-theme="navy"]{--primary:#283593;--primary-light:#5C6BC0;--primary-dark:#1A237E;--primary-bg:#E8EAF6;--main-bg:#F4F6FA}
[data-theme="royal"]{--primary:#3F51B5;--primary-light:#7986CB;--primary-dark:#303F9F;--primary-bg:#E8EAF6;--main-bg:#F5F6FA}
[data-theme="cyan"]{--primary:#00838F;--primary-light:#26C6DA;--primary-dark:#006064;--primary-bg:#E0F7FA;--main-bg:#F0FDFA}
[data-fontsize="small"]{--fs-base:var(--fs-small)}
[data-fontsize="large"]{--fs-base:var(--fs-large)}

/* ========== 布局 ========== */
.app{display:flex;min-height:100vh}

/* 侧边栏 */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s ease}
.sidebar-header{padding:24px 20px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:22px;height:22px;fill:#fff}
.logo-text h1{font-size:calc(var(--fs-base) + 3px);font-weight:700;color:var(--text-primary);white-space:nowrap}
.logo-text span{font-size:calc(var(--fs-base) - 4px);color:var(--text-muted);display:block}
.nav-section-label{padding:16px 24px 8px;font-size:calc(var(--fs-base) - 4px);color:var(--text-muted);font-weight:600;letter-spacing:.5px}
.nav-menu{flex:1;padding:8px 16px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:var(--fs-base);cursor:pointer;transition:all .2s;margin-bottom:4px;font-weight:500}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
.nav-item:hover{background:var(--primary-bg);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(30,100,200,.25)}
.nav-item.active svg{fill:#fff}

/* 侧边栏底部设置 */
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.setting-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.setting-row:last-child{margin-bottom:0}
.setting-label{font-size:calc(var(--fs-base) - 2px);color:var(--text-secondary);font-weight:500}
.font-btn-group{display:flex;gap:4px}
.font-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;transition:all .2s}
.font-btn:hover{border-color:var(--primary);color:var(--primary)}
.font-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.font-btn .sm{font-size:10px}.font-btn .md{font-size:13px}.font-btn .lg{font-size:15px}
.theme-row{display:flex;gap:8px;flex-wrap:wrap}
.theme-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.theme-dot.active{border-color:var(--text-primary);transform:scale(1.1)}

/* 主区域 */
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .3s}
.topbar{height:64px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:50}
.menu-toggle{display:none;width:40px;height:40px;border-radius:8px;align-items:center;justify-content:center;color:var(--text-secondary)}
.menu-toggle svg{width:24px;height:24px;fill:currentColor}
.topbar-title{font-size:calc(var(--fs-base) + 3px);font-weight:700;color:var(--text-primary)}
.topbar-spacer{flex:1}
.topbar-date{font-size:calc(var(--fs-base) - 2px);color:var(--text-secondary);background:var(--primary-bg);padding:4px 14px;border-radius:20px}
.topbar-icon-btn{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all .2s;position:relative}
.topbar-icon-btn:hover{background:var(--primary-bg);color:var(--primary)}
.topbar-icon-btn svg{width:20px;height:20px;fill:currentColor}

.content{flex:1;padding:24px;max-width:1400px;width:100%;margin:0 auto}

/* 遮罩层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;opacity:0;visibility:hidden;transition:opacity .3s}
.overlay.show{opacity:1;visibility:visible}

/* ========== 通用卡片 ========== */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-header h3{font-size:var(--fs-base);font-weight:600;color:var(--text-primary)}
.card-header .icon-box{width:32px;height:32px;border-radius:8px;background:var(--primary-bg);display:flex;align-items:center;justify-content:center}
.card-header .icon-box svg{width:18px;height:18px;fill:var(--primary)}
.card-actions{margin-left:auto;display:flex;gap:8px}

/* 按钮 */
.btn{padding:8px 18px;border-radius:var(--radius-sm);font-size:calc(var(--fs-base) - 1px);font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(30,100,200,.3)}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-outline:hover{background:var(--primary-bg)}
.btn-ghost{background:transparent;color:var(--text-secondary);padding:6px 12px}
.btn-ghost:hover{background:var(--primary-bg);color:var(--primary)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:#FFEBEE}
.btn-sm{padding:5px 12px;font-size:calc(var(--fs-base) - 2px)}
.btn svg{width:16px;height:16px;fill:currentColor}

/* 空状态 */
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-state svg{width:56px;height:56px;fill:var(--border);margin:0 auto 16px}
.empty-state p{font-size:var(--fs-base);margin-bottom:8px}
.empty-state .hint{font-size:calc(var(--fs-base) - 2px);color:var(--text-muted)}

/* ========== 信息报送要点模块 ========== */
.points-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.point-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;transition:all .2s;border-left:4px solid var(--primary);position:relative}
.point-card .point-cat{display:inline-block;font-size:calc(var(--fs-base) - 3px);color:var(--primary);background:var(--primary-bg);padding:2px 10px;border-radius:10px;margin-bottom:8px;font-weight:600}
.point-card h4{font-size:var(--fs-base);font-weight:600;color:var(--text-primary);margin-bottom:6px}
.point-card p{font-size:calc(var(--fs-base) - 1px);color:var(--text-secondary);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.point-card .point-img{margin-top:10px;border-radius:var(--radius-sm);overflow:hidden}
.point-card .point-img img{width:100%;height:auto}
.point-card .point-meta{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.point-card .point-meta span{font-size:calc(var(--fs-base) - 3px);color:var(--text-muted)}
.point-card .point-tools{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.point-card:hover .point-tools{opacity:1}
.icon-btn-sm{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all .15s}
.icon-btn-sm:hover{background:var(--primary-bg);color:var(--primary)}
.icon-btn-sm svg{width:16px;height:16px;fill:currentColor}

/* ========== 信息月历模块 ========== */
.calendar-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.cal-months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.cal-month-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal-month-card.has-events{border:2px solid var(--primary-light)}
.cal-month-head{padding:14px 18px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:space-between}
.cal-month-head h3{font-size:var(--fs-base);font-weight:700}
.cal-month-head .event-count{font-size:calc(var(--fs-base) - 3px);background:rgba(255,255,255,.25);padding:2px 10px;border-radius:10px}
.cal-month-head.no-event{background:var(--border);color:var(--text-secondary)}
.cal-grid{padding:12px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-weekdays span{text-align:center;font-size:calc(var(--fs-base) - 4px);color:var(--text-muted);font-weight:600;padding:4px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{text-align:center;padding:6px 0;font-size:calc(var(--fs-base) - 2px);color:var(--text-secondary);border-radius:6px;min-height:30px}
.cal-day.other{color:var(--border)}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700}
.cal-day.has-event{background:var(--primary-bg);color:var(--primary);font-weight:600}
.cal-events{padding:0 14px 14px}
.cal-event-tag{display:inline-flex;align-items:center;gap:6px;font-size:calc(var(--fs-base) - 2px);padding:6px 12px;border-radius:8px;margin:4px 4px 0 0;background:var(--primary-bg);color:var(--primary-dark);font-weight:500}
.cal-event-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.cal-spans-bar{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px;margin-bottom:20px}
.cal-spans-bar h3{font-size:var(--fs-base);font-weight:600;margin-bottom:12px;color:var(--text-primary)}
.cal-span-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.cal-span-item:last-child{border-bottom:none}
.cal-span-month{font-size:calc(var(--fs-base) - 2px);font-weight:700;color:var(--primary);background:var(--primary-bg);padding:3px 12px;border-radius:8px;white-space:nowrap}
.cal-span-text{font-size:calc(var(--fs-base) - 1px);color:var(--text-secondary)}

/* ========== 信息得分模块 ========== */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;transition:all .2s;cursor:pointer}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-bg)}
.upload-zone svg{width:48px;height:48px;fill:var(--primary-light);margin:0 auto 12px}
.upload-zone h3{font-size:var(--fs-base);color:var(--text-primary);margin-bottom:6px}
.upload-zone p{font-size:calc(var(--fs-base) - 2px);color:var(--text-muted)}
.score-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border)}
.score-tab{padding:10px 28px;font-size:var(--fs-base);font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.score-tab:hover{color:var(--primary)}
.score-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.score-table-wrap{overflow-x:auto;border-radius:var(--radius);box-shadow:var(--shadow);background:var(--card-bg)}
.score-table{width:100%;border-collapse:collapse;font-size:calc(var(--fs-base) - 1px)}
.score-table thead th{background:var(--primary);color:#fff;padding:10px 8px;text-align:center;font-weight:600;white-space:nowrap;border-right:2px solid #fff}
.score-table thead th:last-child{border-right:none}
.score-table tbody td{padding:8px 8px;border-bottom:1px solid var(--border);border-right:1px solid #fff;color:var(--text-primary);white-space:nowrap;text-align:center}
.score-table tbody td:last-child{border-right:none}
.score-table tbody tr:nth-child(even){background:var(--primary-bg)}
.score-table tbody tr:hover{background:#e8f4ff}
.score-table td.rank-1{color:#D4AF37;font-weight:700}
.score-table td.rank-2{color:#A0A0A0;font-weight:700}
.score-table td.rank-3{color:#CD7F32;font-weight:700}
.score-table-title{font-size:var(--fs-base);font-weight:700;color:var(--text-primary);padding:14px 0 10px;border-bottom:2px solid var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.score-table-title .tag{font-size:calc(var(--fs-base) - 4px);background:var(--primary-bg);color:var(--primary);padding:2px 8px;border-radius:6px}
.table-count-badge{font-size:calc(var(--fs-base) - 3px);color:var(--text-muted);background:var(--primary-bg);padding:2px 10px;border-radius:10px;margin-left:8px}

/* ========== 信息知识库模块 ========== */
.kb-l1-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:3px solid var(--border)}
.kb-l1-tab{padding:12px 32px;font-size:calc(var(--fs-base)+1px);font-weight:700;color:var(--text-secondary);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-3px;transition:all .2s;position:relative;white-space:nowrap}
.kb-l1-tab:hover{color:var(--primary)}
.kb-l1-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.kb-l2-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.kb-l2-tab{padding:6px 18px;font-size:var(--fs-base);font-weight:600;color:var(--text-secondary);cursor:pointer;border:2px solid var(--border);border-radius:20px;transition:all .2s;white-space:nowrap}
.kb-l2-tab:hover{color:var(--primary);border-color:var(--primary)}
.kb-l2-tab.active{color:#fff;background:var(--primary);border-color:var(--primary)}
.kb-l2-tab-name{cursor:text;outline:none;min-width:20px;display:inline-block}
.kb-l2-tab-name:focus{background:rgba(255,255,255,.3);border-radius:4px;padding:0 4px}
.kb-add-l2{padding:6px 14px;font-size:var(--fs-base);color:var(--text-muted);cursor:pointer;border:2px dashed var(--border);border-radius:20px;transition:all .2s;background:none;font-weight:600}
.kb-add-l2:hover{color:var(--primary);border-color:var(--primary)}
.kb-overview{background:var(--primary-bg);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-size:calc(var(--fs-base) - 1px);color:var(--text-secondary);line-height:1.8}
.kb-overview strong{color:var(--primary)}
.kb-item{background:var(--card-bg);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:4px solid var(--primary)}
.kb-item-title{font-weight:700;font-size:var(--fs-base);color:var(--text-primary);margin-bottom:8px}
.kb-item-body{font-size:calc(var(--fs-base) - 1px);color:var(--text-secondary);white-space:pre-wrap;line-height:1.8}
.kb-item-tools{position:absolute;top:8px;right:10px;display:flex;gap:4px}
.kb-add-form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.kb-add-form input[type=text]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:var(--fs-base);background:var(--card-bg);color:var(--text-primary)}
.kb-add-form input:focus{outline:none;border-color:var(--primary)}
.kb-upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px}
.kb-upload-zone:hover{border-color:var(--primary);background:var(--primary-bg)}


/* ========== 弹窗 ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s;padding:16px}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.95);transition:transform .3s}
.modal-overlay.show .modal{transform:scale(1)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:calc(var(--fs-base) + 3px);font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all .2s}
.modal-close:hover{background:#FFEBEE;color:var(--danger)}
.modal-close svg{width:20px;height:20px;fill:currentColor}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* 表单 */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:calc(var(--fs-base) - 1px);font-weight:600;color:var(--text-primary);margin-bottom:6px}
.form-label .req{color:var(--danger)}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:var(--fs-base);color:var(--text-primary);background:#fff;transition:border-color .2s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-hint{font-size:calc(var(--fs-base) - 3px);color:var(--text-muted);margin-top:4px}
.form-select{cursor:pointer}

/* 图片上传区 */
.img-upload-area{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.img-upload-area:hover{border-color:var(--primary);background:var(--primary-bg)}
.img-upload-area svg{width:32px;height:32px;fill:var(--primary-light);margin:0 auto 6px}
.img-upload-area p{font-size:calc(var(--fs-base) - 2px);color:var(--text-muted)}
.img-preview{position:relative;margin-top:10px;border-radius:var(--radius-sm);overflow:hidden;display:inline-block}
.img-preview img{max-height:200px;border-radius:var(--radius-sm)}
.img-preview .remove-img{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.img-preview .remove-img svg{width:16px;height:16px;fill:currentColor}

/* 初始化向导 */
.wizard-step{display:none}
.wizard-step.active{display:block}
.wizard-progress{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.wizard-step-indicator{display:flex;align-items:center;flex:1}
.wizard-step-dot{width:32px;height:32px;border-radius:50%;background:var(--border);color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs-base) - 2px);font-weight:700;flex-shrink:0;transition:all .3s}
.wizard-step-dot.active{background:var(--primary)}
.wizard-step-dot.done{background:var(--success)}
.wizard-step-line{flex:1;height:2px;background:var(--border);margin:0 8px}
.wizard-step-line.done{background:var(--success)}
.wizard-step-label{font-size:calc(var(--fs-base) - 2px);color:var(--text-muted);margin-top:4px;text-align:center;white-space:nowrap}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--text-primary);color:#fff;padding:10px 24px;border-radius:var(--radius-sm);font-size:calc(var(--fs-base) - 1px);z-index:300;transition:transform .3s ease;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

/* 附件区 */
.attachments{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.attach-item{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:var(--primary-bg)}
.attach-item img{width:100%;height:90px;object-fit:cover}
.attach-item .attach-name{font-size:calc(var(--fs-base) - 4px);color:var(--text-secondary);padding:4px 6px;word-break:break-all;line-height:1.3}
.attach-item .attach-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.attach-item .attach-del svg{width:14px;height:14px;fill:currentColor}

.underline-input{border:none;border-bottom:2px solid var(--primary);background:transparent;padding:4px 0;font-size:var(--fs-base);color:var(--text-primary);width:100%}
.underline-input:focus{outline:none;border-bottom-color:var(--primary-dark)}

/* ========== 响应式 ========== */
@media(max-width:768px){
  :root{--sidebar-w:260px}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:flex}
  .content{padding:16px}
  .points-grid{grid-template-columns:1fr}
  .cal-months-grid{grid-template-columns:1fr}
  .topbar-date{display:none}
  .score-tab{padding:8px 16px;font-size:calc(var(--fs-base) - 1px)}
  .card{padding:16px}
  .modal{max-width:100%;max-height:95vh}
  .wizard-step-label{font-size:11px}
  .point-card .point-tools{opacity:1}
}
@media(max-width:480px){
  .content{padding:12px}
  .topbar{padding:0 12px;gap:8px}
  .cal-months-grid{gap:12px}
}

/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* 打印隐藏 */
@media print{.sidebar,.topbar,.overlay,.modal-overlay{display:none}.main{margin:0}}
</style>
</head>
<body>
<div class="app">

<!-- 初始化向导弹窗 -->

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ========== 数据层 ========== */
const DB = {
  get(k, def){ try{ const v = localStorage.getItem('xxt_'+k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem('xxt_'+k, JSON.stringify(v)); return true; }catch(e){ showToast('存储空间不足，请删除部分图片或数据','error'); return false; } },
  del(k){ localStorage.removeItem('xxt_'+k); }
};

/* ========== 全局状态 ========== */
let currentPage = 'points';
let editingPointId = null;
let editingImgData = null;
let pendingExcelData = null;

/* ========== 图标库 ========== */
const IC = {
  edit:'<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  add:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>',
  img:'<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
  empty:'<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>',
  refresh:'<svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
};

/* ========== 初始化 ========== */
document.addEventListener('DOMContentLoaded', ()=>{
  loadSettings();
  updateDate();
  setInterval(updateDate, 1000);
  setupNav();
  setupMenuToggle();
  setupFontTheme();
  setupModals();
  setupReinit();
  DB.set('initialized', true);
  renderPage();
});

function updateDate(){
  const now = new Date();
  const days = ['日','一','二','三','四','五','六'];
  const txt = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 周'+days[now.getDay()];
  const el = document.getElementById('topbarDate');
  if(el) el.textContent = txt;
}

/* ========== 导航 ========== */
function setupNav(){
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      currentPage = item.dataset.page;
      const titles = {points:'信息报送要点', scores:'信息得分情况', knowledge:'信息知识库'};
      document.getElementById('pageTitle').textContent = titles[currentPage];
      renderPage();
      // 移动端关闭侧边栏
      if(window.innerWidth <= 768){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
      }
    });
  });
}

function setupMenuToggle(){
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  });
  document.getElementById('overlay').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  });
}

/* ========== 字体与主题 ========== */
function setupFontTheme(){
  document.querySelectorAll('.font-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const size = btn.dataset.size;
      document.documentElement.setAttribute('data-fontsize', size);
      DB.set('fontsize', size);
    });
  });
  document.querySelectorAll('.theme-dot').forEach(dot=>{
    dot.addEventListener('click', ()=>{
      document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
      dot.classList.add('active');
      const theme = dot.dataset.theme;
      document.documentElement.setAttribute('data-theme', theme);
      DB.set('theme', theme);
    });
  });
}

function loadSettings(){
  const fs = DB.get('fontsize','medium');
  const th = DB.get('theme','skyblue');
  document.documentElement.setAttribute('data-fontsize', fs);
  document.documentElement.setAttribute('data-theme', th);
  document.querySelectorAll('.font-btn').forEach(b=>b.classList.toggle('active', b.dataset.size===fs));
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active', d.dataset.theme===th));
}

/* ========== 弹窗基础 ========== */
function setupModals(){
  document.querySelectorAll('.modal-overlay').forEach(overlay=>{
    overlay.addEventListener('click', e=>{
      if(e.target === overlay) overlay.classList.remove('show');
    });
  });
  // 图片上传
  document.getElementById('editImgInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) compressImage(file, data=>{
      editingImgData = data;
      const pv = document.getElementById('editImgPreview');
      pv.innerHTML = '<div class="img-preview"><img src="'+data+'"><button class="remove-img" onclick="removeEditImg()">'+IC.close+'</button></div>';
    });
  });
  // 初始化Excel上传
  document.getElementById('initExcelInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file){
      parseExcel(file, (data, sheetName, tableCount)=>{
        pendingExcelData = data;
        document.getElementById('initExcelName').textContent = '已读取：'+sheetName+'（'+tableCount+'张表）';
        showToast('Excel读取成功，共解析出'+tableCount+'张表','success');
      }, err=>{
        document.getElementById('initExcelName').textContent = '读取失败：'+err;
        document.getElementById('initExcelName').style.color = 'var(--danger)';
      });
    }
  });
  // 得分表上传
  document.getElementById('scoreExcelInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('scoreUploadInfo').innerHTML = '<p style="color:var(--text-muted)">正在读取...</p>';
    parseExcel(file, (data, sheetName, tableCount)=>{
      DB.set('scoreData', data);
      DB.set('scoreFileName', file.name);
      document.getElementById('scoreUploadInfo').innerHTML = '<p style="color:var(--success);font-weight:600">读取成功：'+sheetName+'</p><p style="color:var(--text-muted);font-size:calc(var(--fs-base)-2px);margin-top:4px">共解析出 '+tableCount+' 张表</p>';
      showToast('得分表上传成功','success');
      renderPage();
    }, err=>{
      document.getElementById('scoreUploadInfo').innerHTML = '<p style="color:var(--danger)">读取失败：'+err+'</p>';
    });
  });
}

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show '+(type||'');
  setTimeout(()=>{ t.classList.remove('show'); }, 2500);
}

function setupReinit(){
  document.getElementById('reinitBtn').addEventListener('click', ()=>{
    if(confirm('确定要重新进入初始化设置吗？已保存的数据不会丢失，但可以重新配置。')){
      showInitModal();
    }
  });
}

/* ========== 初始化向导 ========== */
function showInitModal(){
  document.getElementById('initModal').classList.add('show');
  const points = DB.get('points', []);
  if(points.length > 0){
    document.getElementById('initPointsText').value = points.map(p=>{
      if(p.category && p.content) return p.category+' | '+p.title+' | '+p.content;
      if(p.category) return p.category+' | '+p.title;
      return p.title;
    }).join('\n');
  }
  wizardGoTo(1);
}

function wizardGoTo(step){
  for(let i=1; i<=2; i++){
    document.getElementById('step'+i).classList.toggle('active', i===step);
    const dot = document.getElementById('dot'+i);
    dot.classList.remove('active','done');
    if(i < step){ dot.classList.add('done'); dot.textContent = '✓'; }
    else if(i === step){ dot.classList.add('active'); dot.textContent = i; }
    else{ dot.textContent = i; }
    if(i < 2) document.getElementById('line'+i).classList.toggle('done', i < step);
  }
}

function wizardNext(currentStep){
  if(currentStep === 1){
    const text = document.getElementById('initPointsText').value.trim();
    if(!text){ showToast('请输入至少一条信息报送要点','error'); return; }
    const points = parsePointsText(text);
    DB.set('points', points);
    wizardGoTo(2);
  }
}

function wizardPrev(currentStep){
  wizardGoTo(currentStep - 1);
}

function wizardFinish(){
  // 保存Excel数据
  if(pendingExcelData){
    DB.set('scoreData', pendingExcelData);
    pendingExcelData = null;
  }
  DB.set('initialized', true);
  document.getElementById('initModal').classList.remove('show');
  showToast('初始化完成！','success');
  renderPage();
}

function parsePointsText(text){
  const lines = text.split('\n').filter(l=>l.trim());
  return lines.map((line, i)=>{
    const parts = line.split('|').map(s=>s.trim());
    const point = { id: Date.now()+i, createdAt: new Date().toISOString() };
    if(parts.length >= 3){
      point.category = parts[0];
      point.title = parts[1];
      point.content = parts[2];
    } else if(parts.length === 2){
      point.category = parts[0];
      point.title = parts[1];
      point.content = '';
    } else {
      point.category = '其他';
      point.title = parts[0];
      point.content = '';
    }
    return point;
  });
}

}

/* ========== parseCalendarSpans（供信息报送要点月历使用） ========== */
function parseCalendarSpans(text){
  const lines = text.split('\n').filter(l=>l.trim());
  const spans = [];
  for(const line of lines){
    const m = line.trim().match(/(\d+)\s*[-—～~至]\s*(\d+)\s*月[：:]\s*(.+)/);
    if(m){ spans.push({ monthLabel: m[1]+'-'+m[2]+'月', content: m[3].trim() }); continue; }
    const m2 = line.trim().match(/(\d+)\s*月[：:]\s*(.+)/);
    if(m2){ spans.push({ monthLabel: m2[1]+'月', content: m2[2].trim() }); }
  }
  return spans;
}

function renderScoreTable(table, idx){
  let html = '<div class="score-table-title">'+
    '<span>'+(table.title || ('表格 '+(idx+1)))+'</span>';
  if(table.tab) html += '<span class="tag">'+esc(table.tab)+'</span>';

  '</div>';
  html += '<div class="score-table-wrap"><table class="score-table"><thead><tr>';
  const header = table.rows[0] || [];
  header.forEach(cell=>{
    html += '<th>'+esc(String(cell))+'</th>';
  });
  html += '</tr></thead><tbody>';
  for(let i = 1; i < table.rows.length; i++){
    html += '<tr>';
    table.rows[i].forEach((cell, ci)=>{

      // 排名高亮

      html += '<td'+cls+'>'+esc(String(cell))+'</td>';

  html += '</tbody></table></div>';
  return html;

function uploadKbDoc(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt,.md,.docx';
  input.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const text = ev.target.result;
      if(!text || !text.trim()){ showToast('文件内容为空','error'); return; }
      autoClassifyKbDoc(file.name, text);
    };
    if(file.name.endsWith('.txt') || file.name.endsWith('.md')){
      reader.readAsText(file);
    } else {
      reader.readAsText(file);
    }
  };
  input.click();
}

function autoClassifyKbDoc(fileName, text){
  const kb = getKbData();
  const lines = text.split('\n').filter(l=>l.trim());
  if(lines.length === 0){ showToast('文档内容为空','error'); return; }

  const catName = fileName.replace(/\.(txt|md|docx)$/i, '').trim();
  let items = [];

  // 按中文编号拆分
  const numPattern = /^[一二三四五六七八九十]+[、．.]/;
  const matchedLines = [];
  let currentSection = null;

  lines.forEach(line=>{
    if(numPattern.test(line.trim())){
      if(currentSection) matchedLines.push(currentSection);
      currentSection = { title: line.trim().replace(numPattern, '').trim(), body: '' };
    } else if(currentSection){
      currentSection.body += (currentSection.body ? '\n' : '') + line.trim();
    }
  });
  if(currentSection) matchedLines.push(currentSection);

  if(matchedLines.length > 0){
    items = matchedLines.map(s=>({ title: s.title || '未命名', body: s.body }));
  } else {
    items = [{ title: catName, body: text.trim() }];
  }

  // 添加到当前一级标签下
  const l1 = kb[currentKbL1];
  // 检查是否已有同名分类
  let cat = l1.categories.find(c=>c.name === catName);
  if(cat){
    cat.items = cat.items.concat(items);
  } else {
    l1.categories.push({ name: catName, items });
    currentKbL2 = l1.categories.length - 1;
  }

  DB.set('knowledge', kb);
  renderPage();
  showToast('文档已导入当前分类','success');
}

/* ========== Excel解析 ========== */
function parseExcel(file, onSuccess, onError){
  try{
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array', cellDates:false, cellNF:false, cellText:false });
        // 查找"全自动排序"工作表
        let sheetName = wb.SheetNames.find(n=>n.includes('全自动排序') || n.includes('排序'));
        if(!sheetName) sheetName = wb.SheetNames[0]; // 取第一个

        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:false });
        // 过滤尾部全空行
        while(rows.length > 0 && rows[rows.length-1].every(c=>String(c).trim()==='')) rows.pop();

        // 读取合并单元格信息
        const allMerges = (sheet['!merges'] || []).map(m=>({
          sr: m.s.r, sc: m.s.c, er: m.e.r, ec: m.e.c
        }));

        // 检测多张表（通过空行分隔），传入合并信息
        const tables = detectTables(rows, allMerges);

        // 自动分类：地市 / 直报点
        tables.forEach(t=>{
          const allText = (t.title + ' ' + t.rows.map(r=>r.join(' ')).join(' ')).toLowerCase();
          if(allText.includes('直报') || allText.includes('直报点')){
            t.tab = '直报点';
          } else if(allText.includes('地市') || allText.includes('市公司') || allText.includes('分公司')){
            t.tab = '地市';
          } else {
            t.tab = currentScoreTab || '地市'; // 默认归入当前标签
          }
        });

        const result = { sheetName, tables, rawRows: rows, parsedAt: new Date().toISOString() };
        onSuccess(result, sheetName, tables.length);
      }catch(err){
        onError(err.message || '解析失败');
      }
    };
    reader.onerror = ()=>{ onError('文件读取失败'); };
    reader.readAsArrayBuffer(file);
  }catch(err){
    onError(err.message || '解析失败');
  }
}

function detectTables(rows, allMerges){
  const tables = [];
  let current = null;
  let tableIdx = 0;
  let currentOrigStart = -1; // 当前表在原始行中的起始行号

  for(let i = 0; i < rows.length; i++){
    const row = rows[i];
    const isEmpty = row.every(c=>String(c).trim()==='');

    if(isEmpty){
      if(current && current.rows.length > 1){
        current.merges = calcTableMerges(allMerges, currentOrigStart, current.rows.length);
        tables.push(current);
        current = null;
      }
      continue;
    }

    if(!current){
      const nonEmptyCount = row.filter(c=>String(c).trim()!=='').length;
      if(nonEmptyCount === 1 && i < rows.length - 1){
        current = { title: String(row[0]).trim(), rows: [], tab: '', merges:[] };
        currentOrigStart = i + 1; // 标题行被剥离，数据从下一行开始
      } else {
        current = { title: '表格 '+(tableIdx+1), rows: [], tab: '', merges:[] };
        current.rows.push(row);
        currentOrigStart = i;
      }
    } else {
      const nonEmptyCount = row.filter(c=>String(c).trim()!=='').length;
      if(nonEmptyCount === 1 && current.rows.length >= 3){
        current.merges = calcTableMerges(allMerges, currentOrigStart, current.rows.length);
        tables.push(current);
        tableIdx++;
        current = { title: String(row[0]).trim(), rows: [], tab: '', merges:[] };
        currentOrigStart = i + 1;
      } else {
        current.rows.push(row);
      }
    }
  }
  if(current && current.rows.length > 0){
    current.merges = calcTableMerges(allMerges, currentOrigStart, current.rows.length);
    tables.push(current);
  }

  // 如果只检测到一张表，但行数很多（>30），尝试按内容拆分
  if(tables.length === 1 && tables[0].rows.length > 30){
    // 保持原样，不拆分
  }

  return tables;
}

// 将全局合并信息转换为表内相对行号的合并信息
function calcTableMerges(allMerges, origStartRow, tableRowCount){
  if(!allMerges || allMerges.length === 0) return [];
  const result = [];
  allMerges.forEach(m=>{
    const sr = m.sr - origStartRow;
    const er = m.er - origStartRow;
    if(sr >= 0 && sr < tableRowCount && er >= 0){
      result.push({ sr, sc:m.sc, er:Math.min(er, tableRowCount-1), ec:m.ec });
    }
  });
  return result;
}

/* ========== 图片压缩 ========== */
function compressImage(file, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxW = 1024;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL('image/jpeg', 0.65);
      callback(data);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ========== 附件功能 ========== */
function renderAttachments(key, attachments, title){
  let html = '<div class="card" style="margin-top:20px"><div class="card-header">'+
    '<div class="icon-box">'+IC.img+'</div><h3>'+esc(title)+'</h3></div>';
  html += '<div class="img-upload-area" id="attachUpload_'+key+'" onclick="document.getElementById(\'attachInput_'+key+'\').click()">'+
    IC.upload+'<p>点击上传图片或文件</p></div>';
  html += '<input type="file" id="attachInput_'+key+'" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" style="display:none" multiple>';
  if(attachments.length > 0){
    html += '<div class="attachments"><div class="attach-grid">';
    attachments.forEach((att, i)=>{
      html += '<div class="attach-item" data-idx="'+i+'">';
      if(att.type === 'image'){
        html += '<img src="'+att.data+'">';
      } else {
        html += '<div style="height:90px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs-base)-3px);color:var(--primary);text-align:center;padding:4px">'+esc(att.name)+'</div>';
      }
      html += '<div class="attach-name">'+esc(att.name)+'</div>';
      html += '<button class="attach-del" onclick="deleteAttachment(\''+key+'\','+i+')">'+IC.close+'</button>';
      html += '</div>';
    });
    html += '</div></div>';
  } else {
    html += '<p style="text-align:center;color:var(--text-muted);font-size:calc(var(--fs-base)-2px);padding:12px">暂无附件</p>';
  }
  html += '</div>';
  return html;
}

function setupAttachments(key){
  const input = document.getElementById('attachInput_'+key);
  if(!input) return;
  input.addEventListener('change', function(e){
    const files = Array.from(e.target.files);
    if(files.length === 0) return;
    const attachments = DB.get(key, []);
    let processed = 0;
    files.forEach(file=>{
      if(file.type.startsWith('image/')){
        compressImage(file, data=>{
          attachments.push({ name: file.name, type:'image', data, addedAt: new Date().toISOString() });
          processed++;
          if(processed === files.length){ DB.set(key, attachments); renderPage(); }
        });
      } else {
        // 非图片文件，仅存名称
        const reader = new FileReader();
        reader.onload = function(ev){
          // 限制大小：非图片文件不存base64内容（太大），只存元数据
          if(file.size < 500000){
            attachments.push({ name: file.name, type:'file', data: ev.target.result, addedAt: new Date().toISOString() });
          } else {
            attachments.push({ name: file.name, type:'file', data:'', addedAt: new Date().toISOString(), tooLarge: true });
          }
          processed++;
          if(processed === files.length){ DB.set(key, attachments); renderPage(); }
        };
        reader.readAsDataURL(file);
      }
    });
  });
}

function deleteAttachment(key, idx){
  const attachments = DB.get(key, []);
  attachments.splice(idx, 1);
  DB.set(key, attachments);
  renderPage();
}

/* ========== 工具函数 ========== */
function esc(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
